; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
description = Library to support Microchip MPC3x6xR 16/24bit analog to digital converters.

# common env settings

[env]
framework = arduino
check_tool = cppcheck, clangtidy
test_build_src = yes
debug_build_flags = -Og -g3 -ggdb

# ci native test

[test]
platform = native
build_type = test
lib_deps =
    ArduinoFake=https://github.com/FabioBatSilva/ArduinoFake
build_flags =
    -DPIO_NATIVE_TESTING
    -frtti
    -fexceptions


# Arduino UNO shaped boards

[env:ESP32]
platform = espressif32
board = wemos_d1_uno32

[env:ESP8266]
platform = espressif8266
board = d1
test_speed = 9600

[env:ATMEGA328P]
platform = atmelavr
board = uno

[env:SAMD51P20A]
platform = atmelsam
board = adafruit_grandcentral_m4


# Sparkfun PROMICRO shaped boards

[env:ATMEGA32U4]
platform = atmelavr
board = sparkfun_promicro8

[env:test_ATMEGA32U4]
extends = test, env:ATMEGA32U4

[env:SAMD21G18A]
platform = atmelsam
#board = sparkfun_samd21_mini_usb
board = adafruit_metro_m0

[env:test_SAMD21G18A]
build_type = debug
platform = atmelsam
board = adafruit_metro_m0
#board = sparkfun_samd21_mini_usb
debug_tool = atmel-ice
#debug_build_flags = -Og -g3 -ggdb
upload_protocol = atmel-ice
debug_init_break = tbreak setup

# Adafruit FEATHER shaped boards

[env:STM32F405RGT6]
platform = ststm32
board = adafruit_feather_f405

[env:NRF52832]
platform = nordicnrf52
board = adafruit_feather_nrf52832

[env:ESP32-S2]
platform = espressif32
board = featheresp32-s2

[env:ESP32-S3]
platform = espressif32
board = adafruit_feather_esp32s3_nopsram


# other board shapes

[env:ESP32-C3]
platform = espressif32
board = esp32-c3-m1i-kit

[env:IMXRT1062]
platform = teensy
board = teensy40

[env:STM32F103C8]
platform = ststm32
board = bluepill_f103c6
